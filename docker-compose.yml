services:
  app:
    image: heretous:local
    pull_policy: never
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}?sslmode=disable"
      LOG_LEVEL: "${LOG_LEVEL:-}"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "2", "--noproxy", "*", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 65s

  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  deps:
    image: golang:1.25-bookworm
    working_dir: /app
    profiles:
      - tools
    command: ["sh", "-c", "gofmt -w cmd internal migrations && go mod tidy"]
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod

volumes:
  postgres-data:
  go-mod-cache:
