services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      HTTP_SHUTDOWN_TIMEOUT: "10s"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    stop_grace_period: 15s

  tests:
    build:
      context: .
      target: test
    profiles:
      - test
    labels:
      com.heretous.task: test
    volumes:
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod

volumes:
  go-build-cache:
  go-mod-cache:
