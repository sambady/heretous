services:
  app:
    image: heretous:local
    build: .
    pull_policy: build
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-heretous}:${POSTGRES_PASSWORD:-heretous}@postgres:5432/${POSTGRES_DB:-heretous}?sslmode=disable"
      LOG_LEVEL: "${LOG_LEVEL:-DEBUG}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "2", "--noproxy", "*", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 65s

  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-heretous}"
      POSTGRES_USER: "${POSTGRES_USER:-heretous}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-heretous}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  postgres-data:
