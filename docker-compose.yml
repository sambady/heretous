services:
  app:
    image: heretous:local
    pull_policy: never
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-heretous}:${POSTGRES_PASSWORD:-heretous}@postgres:5432/${POSTGRES_DB:-heretous}?sslmode=disable"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "2", "--noproxy", "*", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 65s

  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-heretous}"
      POSTGRES_USER: "${POSTGRES_USER:-heretous}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-heretous}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  postgres-test:
    image: postgres:18-bookworm
    profiles:
      - test
    environment:
      POSTGRES_DB: heretous_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d heretous_test"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  tests:
    image: golang:1.25-bookworm
    working_dir: /app
    command: ["sh", "-c", "go vet ./... && go test -race -count=1 -timeout=60s ./..."]
    profiles:
      - test
    labels:
      com.heretous.task: test
    environment:
      TEST_DATABASE_URL: "postgres://test:test@postgres-test:5432/heretous_test?sslmode=disable"
      TEST_APP_URL: "http://app:8080"
    depends_on:
      app:
        condition: service_healthy
      postgres-test:
        condition: service_healthy
    volumes:
      - .:/app:ro
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod

  deps:
    image: golang:1.25-bookworm
    working_dir: /app
    profiles:
      - tools
    command: ["sh", "-c", "gofmt -w cmd internal migrations tests && go mod tidy"]
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod

volumes:
  postgres-data:
  go-build-cache:
  go-mod-cache:
